.vj { --bg:#F3F2EE; --raised:#FBFAF7; --ink:#23211E; --muted:#7B776F; --faint:#A9A49B;
  --hair:#E4E1DA; --field:#ECEAE4; --accent:#23211E; --shadow:0 1px 2px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.06);
  min-height:100vh; background:var(--bg); color:var(--ink);
  font-family:-apple-system,"PingFang TC","PingFang SC","Helvetica Neue",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased; }
.vj[data-theme="dark"] { --bg:#1A1917; --raised:#232220; --ink:#ECEAE4; --muted:#9C978E;
  --faint:#726E66; --hair:#322F2B; --field:#2A2825; --accent:#ECEAE4;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35); }
.vj[data-theme="red"]{ --bg:#4A010A; --raised:#5A0A13; --ink:#C18F4E; --muted:#A2773F; --faint:#7F5E33; --hair:#6E1C24; --field:#580912; --accent:#C18F4E; --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(20,0,4,.5); }
.vj[data-theme="brown"]{ --bg:#492D22; --raised:#56372A; --ink:#F2E3C6; --muted:#C6B69B; --faint:#9A8B73; --hair:#6A4B3A; --field:#543528; --accent:#F2E3C6; --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(20,10,6,.5); }
.vj[data-theme="purple"]{ --bg:#7D6D91; --raised:#8A7B9D; --ink:#DBCDCA; --muted:#C3B6BC; --faint:#A89BAF; --hair:#91859C; --field:#86789A; --accent:#DBCDCA; --shadow:0 1px 2px rgba(0,0,0,.22),0 10px 30px rgba(40,30,55,.38); }
.vj[data-theme="pink"]{ --bg:#FED0D3; --raised:#FFDADD; --ink:#555D50; --muted:#787F73; --faint:#9DA199; --hair:#F4C5CA; --field:#FCDADD; --accent:#474E43; --shadow:0 1px 2px rgba(0,0,0,.06),0 10px 30px rgba(180,120,130,.16); }
.vj[data-theme="green"]{ --bg:#64A386; --raised:#71AE92; --ink:#FBFCCB; --muted:#DDE7B6; --faint:#B6CB99; --hair:#7BB59B; --field:#6CAA8D; --accent:#FBFCCB; --shadow:0 1px 2px rgba(0,0,0,.18),0 10px 30px rgba(30,70,55,.35); }
.vj *{ box-sizing:border-box; }
.vj .serif{ font-family:"Songti TC",STSongti,"Songti SC","Source Han Serif TC","Noto Serif CJK TC",Georgia,"Times New Roman",serif; }
.vj button{ font-family:inherit; cursor:pointer; border:none; background:none; color:inherit; }
.vj-wrap{ max-width:680px; margin:0 auto; padding:0 20px 96px; }

.vj-top{ position:sticky; top:0; z-index:20; background:var(--bg); padding:18px 0 10px; border-bottom:1px solid var(--hair); }
.vj-titlerow{ display:flex; align-items:center; justify-content:space-between; gap:12px; }
.vj-name{ font-size:25px; font-weight:600; letter-spacing:.04em; }
.vj-icons{ display:flex; gap:4px; }
.vj-ic{ width:38px; height:38px; border-radius:10px; display:grid; place-items:center; color:var(--muted); transition:background .15s,color .15s; }
.vj-ic:hover{ background:var(--field); color:var(--ink); }
.vj-ic:active{ transform:scale(.94); }

.vj-seg{ display:inline-flex; gap:2px; margin-top:14px; background:var(--field); padding:3px; border-radius:11px; max-width:100%; }
.vj-seg button{ display:flex; align-items:center; gap:5px; padding:7px 12px; border-radius:8px; font-size:13px; color:var(--muted); font-weight:500; transition:.15s; white-space:nowrap; }
.vj-seg button.on{ background:var(--raised); color:var(--accent); box-shadow:0 1px 2px rgba(0,0,0,.06); }

.vj-searchbar{ display:flex; align-items:center; gap:8px; margin-top:12px; background:var(--field); border-radius:11px; padding:0 12px; }
.vj-searchbar input{ flex:1; background:none; border:none; outline:none; color:var(--ink); font-size:15px; padding:11px 0; font-family:inherit; }
.vj-searchbar input::placeholder{ color:var(--faint); }

.vj-head{ font-size:12px; letter-spacing:.12em; text-transform:uppercase; color:var(--faint); margin:30px 0 8px; display:flex; align-items:center; gap:10px; font-weight:600; }
.vj-head .line{ flex:1; height:1px; background:var(--hair); }

.vj-row{ display:flex; align-items:baseline; gap:13px; width:100%; text-align:left; padding:15px 4px; border-bottom:1px solid var(--hair); transition:.12s; }
.vj-row:hover{ background:var(--raised); border-radius:8px; }
.vj-dots{ width:28px; display:flex; align-items:center; gap:3px; flex:none; transform:translateY(2px); }
.vj-dot{ border-radius:50%; box-shadow:0 0 0 2px var(--bg); width:9px; height:9px; }
.vj-dot.lead{ width:10px; height:10px; }
.vj-dot.sec{ width:5px; height:5px; opacity:.45; box-shadow:none; }
.vj-dot.empty{ width:9px; height:9px; background:transparent; border:1px solid var(--faint); box-shadow:none; }
.vj-date{ font-size:14px; color:var(--muted); font-variant-numeric:tabular-nums; min-width:40px; flex:none; }
.vj-prev{ flex:1; min-width:0; }
.vj-ptitle{ font-size:16px; line-height:1.45; margin-bottom:2px; }
.vj-pbody{ font-size:14px; color:var(--muted); line-height:1.55; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }

.vj-chips{ display:flex; flex-wrap:wrap; gap:8px; margin:18px 0 4px; }
.vj-chip{ display:inline-flex; align-items:center; gap:7px; padding:7px 13px; border-radius:999px; border:1px solid var(--hair); font-size:13.5px; color:var(--muted); transition:.15s; }
.vj-chip.on{ border-color:var(--accent); color:var(--accent); }
.vj-chip .cdot{ width:8px; height:8px; border-radius:50%; }
.vj-chip .cnum{ color:var(--faint); font-variant-numeric:tabular-nums; }

.vj-empty{ text-align:center; padding:90px 20px; color:var(--faint); }
.vj-empty h3{ font-size:18px; color:var(--muted); font-weight:500; margin:0 0 6px; }
.vj-empty p{ font-size:14px; margin:0; }

.vj-fab{ position:fixed; right:max(20px,calc(50vw - 320px)); bottom:26px; z-index:30; width:56px; height:56px; border-radius:18px; background:var(--accent); color:var(--bg); display:grid; place-items:center; box-shadow:var(--shadow); transition:.15s; }
.vj-fab:hover{ transform:translateY(-2px); }
.vj-fab:active{ transform:scale(.95); }

.vj-screen{ position:fixed; inset:0; z-index:40; background:var(--bg); overflow-y:auto; animation:vjslide .22s ease; }
@keyframes vjslide{ from{ opacity:0; transform:translateY(8px);} to{ opacity:1; transform:none;} }
.vj-sc-wrap{ max-width:680px; margin:0 auto; padding:0 20px 60px; }
.vj-sc-top{ display:flex; align-items:center; justify-content:space-between; padding:16px 0; position:sticky; top:0; background:var(--bg); z-index:2; }
.vj-textbtn{ font-size:15px; color:var(--muted); padding:8px; border-radius:8px; }
.vj-textbtn:hover{ color:var(--ink); }
.vj-savebtn{ font-size:15px; font-weight:600; color:var(--ink); padding:8px 16px; border-radius:10px; background:var(--field); }
.vj-savebtn:disabled{ color:var(--faint); }

.vj-dateinput{ font-size:14px; color:var(--muted); background:var(--field); border:none; border-radius:9px; padding:9px 12px; font-family:inherit; outline:none; }
.vj-emrow{ display:grid; grid-template-columns:repeat(auto-fill, minmax(104px,1fr)); gap:8px; margin:16px 0; }
.vj-empick{ display:inline-flex; align-items:center; justify-content:flex-start; gap:7px; padding:8px 13px; border-radius:999px; border:1px solid var(--hair); font-size:13.5px; color:var(--muted); transition:.12s; white-space:nowrap; overflow:hidden; }
.vj-empick > span:last-child{ overflow:hidden; text-overflow:ellipsis; }
.vj-empick.on{ color:#fff; border-color:transparent; }
.vj-empick.dis{ opacity:.35; cursor:default; }
.vj-empick .pdot{ width:8px; height:8px; border-radius:50%; }
.vj-titlein{ width:100%; background:none; border:none; outline:none; color:var(--ink); font-size:21px; font-weight:600; padding:8px 0; margin-top:4px; font-family:Georgia,"Times New Roman","Songti TC","Source Han Serif TC",serif; }
.vj-titlein::placeholder{ color:var(--faint); font-weight:500; }
.vj-bodyin{ width:100%; min-height:46vh; background:none; border:none; outline:none; resize:none; overflow-y:auto; color:var(--ink); font-size:17px; line-height:1.85; padding:6px 0; }
.vj-emfont{ font-family:"Times New Roman", Georgia, "Songti TC", "Source Han Serif TC", serif; }
.vj[data-lang="en"] .vj-emfont{ font-weight:700; }
.vj-name, .vj-rtitle{ font-family:Georgia,"Times New Roman","Songti TC","Source Han Serif TC",serif; }

.vj-cal{ margin-top:6px; }
.vj-cal-nav{ display:flex; align-items:center; justify-content:space-between; margin:16px 0 10px; }
.vj-cal-month{ font-size:16px; font-weight:600; letter-spacing:.02em; }
.vj-cal-grid{ display:grid; grid-template-columns:repeat(7,1fr); gap:4px; }
.vj-cal-wkd{ text-align:center; font-size:11px; color:var(--faint); padding:2px 0 6px; font-weight:600; }
.vj-cal-cell{ aspect-ratio:1/1; border-radius:11px; display:flex; flex-direction:column; align-items:center; gap:4px; padding:7px 2px 4px; color:var(--muted); transition:.12s; }
.vj-cal-cell.empty{ pointer-events:none; }
.vj-cal-cell.has{ color:var(--ink); cursor:pointer; }
.vj-cal-cell.has:hover{ background:var(--raised); }
.vj-cal-cell.sel{ background:var(--field); }
.vj-cal-cell.today .vj-cal-num{ color:var(--accent); font-weight:700; }
.vj-cal-num{ font-size:13px; font-variant-numeric:tabular-nums; line-height:1; }
.vj-cal-dots{ display:flex; gap:2px; flex-wrap:wrap; justify-content:center; max-width:100%; }
.vj-cal-dot{ width:5px; height:5px; border-radius:50%; }
.vj-cal-day{ margin-top:6px; }
.vj-bodyin::placeholder{ color:var(--faint); }

.vj-rmeta{ display:flex; flex-wrap:wrap; align-items:center; gap:8px; color:var(--muted); font-size:13px; margin:8px 0 18px; }
.vj-rdot{ width:9px; height:9px; border-radius:50%; }
.vj-rsep{ color:var(--hair); }
.vj-redit{ color:var(--faint); font-size:12px; }
.vj-rtitle{ font-size:26px; font-weight:600; line-height:1.35; margin:0 0 18px; }
.vj-rbody{ font-size:17.5px; line-height:1.95; white-space:pre-wrap; word-break:break-word; }
.vj-ractions{ display:flex; gap:10px; margin-top:40px; padding-top:22px; border-top:1px solid var(--hair); flex-wrap:wrap; }
.vj-act{ display:inline-flex; align-items:center; gap:7px; font-size:14px; color:var(--muted); padding:9px 15px; border-radius:10px; border:1px solid var(--hair); transition:.15s; }
.vj-act:hover{ color:var(--ink); background:var(--raised); }
.vj-act.danger:hover{ color:#C8765A; border-color:#C8765A; }

.vj-set-grp{ margin-top:26px; }
.vj-set-label{ font-size:12px; letter-spacing:.1em; text-transform:uppercase; color:var(--faint); font-weight:600; margin-bottom:10px; }
.vj-set-note{ font-size:12.5px; color:var(--faint); margin:-4px 0 10px; }
.vj-toggle{ display:inline-flex; background:var(--field); border-radius:10px; padding:3px; gap:2px; }
.vj-swatches{ display:flex; flex-wrap:wrap; gap:15px; }
.vj-sw{ display:flex; flex-direction:column; align-items:center; gap:7px; padding:0; background:none; }
.vj-sw-dot{ width:42px; height:42px; border-radius:50%; border:1px solid var(--hair); display:grid; place-items:center; transition:.15s; }
.vj-sw-dot .inner{ width:15px; height:15px; border-radius:50%; }
.vj-sw.on .vj-sw-dot{ box-shadow:0 0 0 2px var(--bg), 0 0 0 4px var(--accent); }
.vj-sw-label{ font-size:11px; color:var(--muted); }
.vj-sw.on .vj-sw-label{ color:var(--ink); font-weight:600; }
.vj-bgrow{ display:flex; flex-direction:column; gap:12px; }
.vj-bgctl{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
.vj-bgprev{ width:34px; height:34px; border-radius:8px; border:1px solid var(--hair); background-size:cover; background-position:center; flex:none; }
.vj-toggle button{ padding:8px 16px; border-radius:8px; font-size:14px; color:var(--muted); display:flex; align-items:center; gap:6px; }
.vj-toggle button.on{ background:var(--raised); color:var(--ink); box-shadow:0 1px 2px rgba(0,0,0,.06); }
.vj-emmanage{ display:flex; flex-direction:column; gap:8px; }
.vj-emitem{ display:flex; align-items:center; gap:11px; background:var(--raised); border:1px solid var(--hair); border-radius:11px; padding:9px 11px; }
.vj-emnames{ flex:1; display:flex; flex-direction:column; gap:4px; min-width:0; }
.vj-emnames input{ background:none; border:none; outline:none; color:var(--ink); font-size:15px; font-family:"Times New Roman", Georgia, "Songti TC", "Source Han Serif TC", serif; width:100%; }
.vj-emnames input.sub{ font-size:13px; color:var(--muted); }
.vj-emitem input[type=color]{ width:30px; height:30px; border:none; border-radius:8px; background:none; cursor:pointer; padding:0; flex:none; }
.vj-emitem input[type=color]::-webkit-color-swatch{ border:none; border-radius:8px; }
.vj-emitem input[type=color]::-webkit-color-swatch-wrapper{ padding:0; }
.vj-emdel{ width:32px; height:32px; border-radius:8px; display:grid; place-items:center; color:var(--faint); flex:none; }
.vj-emdel:hover{ color:#C8765A; background:var(--field); }
.vj-addem{ display:flex; align-items:center; justify-content:center; gap:7px; margin-top:10px; width:100%; padding:11px; border-radius:11px; border:1px dashed var(--hair); color:var(--muted); font-size:14px; }
.vj-addem:hover{ color:var(--ink); border-color:var(--muted); }
.vj-databtns{ display:flex; gap:10px; flex-wrap:wrap; }
.vj-namein{ width:100%; background:var(--field); border:none; outline:none; border-radius:10px; padding:11px 13px; color:var(--ink); font-size:15px; font-family:inherit; }
.vj-appname{ font-size:13px; color:var(--muted); margin:34px 0 60px; text-align:center; }
.vj-toast{ position:fixed; left:50%; bottom:34px; transform:translateX(-50%); z-index:60; background:var(--ink); color:var(--bg); font-size:13.5px; padding:10px 18px; border-radius:999px; display:flex; align-items:center; gap:7px; box-shadow:var(--shadow); animation:vjpop .2s ease; }
@keyframes vjpop{ from{ opacity:0; transform:translate(-50%,6px);} to{ opacity:1; transform:translate(-50%,0);} }
